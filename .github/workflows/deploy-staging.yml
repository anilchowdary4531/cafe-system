name: Staging CI & Isolated AWS Deployment (TWM Pay)

on:
  push:
    branches:
      - "staging/**"
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Attempt isolated AWS staging backend deployment after CI checks pass"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: Run Required CI Pipeline
    uses: ./.github/workflows/ci.yml

  verify-vercel-preview:
    name: Verify Vercel Preview Deployment
    runs-on: ubuntu-latest
    needs: [ci]
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.ref != 'refs/heads/main' }}

    steps:
      - name: Inspect Vercel Git integration deployment for exact commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DEPLOYMENT_JSON=""
          for i in $(seq 1 12); do
            DEPLOYMENT_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${EXPECTED_SHA}&environment=Preview&per_page=5" | jq '.[0] // empty')
            if [ -n "${DEPLOYMENT_JSON}" ]; then
              break
            fi
            echo "Waiting for Vercel Preview deployment record for ${EXPECTED_SHA}... (${i}/12)"
            sleep 5
          done

          {
            echo "## Vercel Preview Verification"
            echo ""
            echo "- **Expected Commit SHA**: \`${EXPECTED_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${DEPLOYMENT_JSON}" ]; then
            echo "No Vercel Preview deployment record found yet for ${EXPECTED_SHA}."
            echo "- **Deployment Status**: Pending / not yet created by Vercel Git integration" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          DEPLOY_ID=$(echo "${DEPLOYMENT_JSON}" | jq -r '.id')
          DEPLOY_SHA=$(echo "${DEPLOYMENT_JSON}" | jq -r '.sha')

          STATUS_JSON="{}"
          for i in $(seq 1 18); do
            LATEST_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOY_ID}/statuses" | jq -c '.[0] // empty')
            if [ -n "${LATEST_STATUS}" ]; then
              STATUS_JSON="${LATEST_STATUS}"
            fi
            STATE=$(echo "${STATUS_JSON}" | jq -r '.state // "pending"')
            if [ "${STATE}" = "success" ] || [ "${STATE}" = "failure" ] || [ "${STATE}" = "error" ]; then
              break
            fi
            echo "Waiting for Vercel Preview deployment ${DEPLOY_ID} state=${STATE}... (${i}/18)"
            sleep 5
          done

          STATE=$(echo "${STATUS_JSON}" | jq -r '.state // "unknown"')
          TARGET_URL=$(echo "${STATUS_JSON}" | jq -r '.environment_url // .target_url // ""')
          echo "Vercel deployment ID: ${DEPLOY_ID}, state: ${STATE}, sha: ${DEPLOY_SHA}, url: ${TARGET_URL}"

          {
            echo "- **Deployment ID**: \`${DEPLOY_ID}\`"
            echo "- **Deployed Commit SHA**: \`${DEPLOY_SHA}\`"
            echo "- **Deployment State**: \`${STATE}\`"
            echo "- **Preview URL**: ${TARGET_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${TARGET_URL}" ]; then
            if [ -n "${VERCEL_BYPASS}" ]; then
              HTML=$(curl -fsSL -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" "${TARGET_URL}")
              BUNDLE_PATH=$(echo "${HTML}" | grep -oE '/assets/index-[^" ]+\.js' | head -n1 || true)
              if [ -n "${BUNDLE_PATH}" ]; then
                BUNDLE_JS=$(curl -fsSL -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" "${TARGET_URL}${BUNDLE_PATH}")
                if echo "${BUNDLE_JS}" | grep -q "staging-api.tiffzy.com"; then
                  echo "Verified live Preview bundle routes to staging-api.tiffzy.com"
                  echo "- **Live Bundle API Check**: Verified \`staging-api.tiffzy.com\` (authorized bypass)" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::Live Preview bundle does not contain staging-api.tiffzy.com (check Vercel Preview env vars)."
                  echo "- **Live Bundle API Check**: \`staging-api.tiffzy.com\` NOT found in live bundle (check Vercel Preview env vars)" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            else
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}" || true)
              echo "Unauthenticated probe to ${TARGET_URL} returned HTTP ${HTTP_CODE}"
              echo "- **Access Check**: HTTP \`${HTTP_CODE}\` (Vercel Deployment Protection / SSO active)" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  deploy-staging:
    name: Deploy Backend to Isolated AWS Staging
    runs-on: ubuntu-latest
    needs: [ci]
    if: >-
      ${{
        !cancelled() &&
        needs.ci.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || (github.event.inputs.deploy_backend != false && github.event.inputs.deploy_backend != 'false'))
      }}
    environment: staging

    steps:
      - name: Checkout target commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight Check — Staging Secrets & Infrastructure Isolation
        id: preflight
        env:
          STAGING_EC2_HOST: ${{ secrets.STAGING_EC2_HOST }}
          STAGING_EC2_USER: ${{ secrets.STAGING_EC2_USER }}
          STAGING_EC2_SSH_KEY: ${{ secrets.STAGING_EC2_SSH_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          STAGING_TWM_MERCHANT_ID: ${{ secrets.STAGING_TWM_MERCHANT_ID }}
          STAGING_TWM_API_SECRET: ${{ secrets.STAGING_TWM_API_SECRET }}
          STAGING_TWM_SIGNING_KEY: ${{ secrets.STAGING_TWM_SIGNING_KEY }}
          TWM_ENABLED: ${{ vars.STAGING_TWM_ENABLED || 'true' }}
          TWM_NOTIFY_URL: ${{ vars.STAGING_TWM_NOTIFY_URL || 'https://staging-api.tiffzy.com/api/payments/twm/notify' }}
          TWM_RETURN_URL: ${{ vars.STAGING_TWM_RETURN_URL || '' }}
          STAGING_API_HOST: staging-api.tiffzy.com
        run: |
          set -euo pipefail
          MISSING_SECRETS=()
          MISSING_INFRA=()

          check_secret() {
            local name="$1"
            local val="$2"
            if [ -z "${val}" ]; then
              MISSING_SECRETS+=("${name}")
              echo "MISSING secret: ${name}"
            else
              echo "PRESENT secret: ${name}"
            fi
          }

          check_secret "STAGING_EC2_HOST" "${STAGING_EC2_HOST}"
          check_secret "STAGING_EC2_USER" "${STAGING_EC2_USER}"
          check_secret "STAGING_EC2_SSH_KEY" "${STAGING_EC2_SSH_KEY}"
          check_secret "STAGING_DATABASE_URL" "${STAGING_DATABASE_URL}"
          check_secret "STAGING_JWT_SECRET" "${STAGING_JWT_SECRET}"
          check_secret "STAGING_TWM_MERCHANT_ID" "${STAGING_TWM_MERCHANT_ID}"
          check_secret "STAGING_TWM_API_SECRET" "${STAGING_TWM_API_SECRET}"
          check_secret "STAGING_TWM_SIGNING_KEY" "${STAGING_TWM_SIGNING_KEY}"

          PROD_API_IP=$(dig +short api.tiffzy.com A | head -n1 || true)
          STAGING_DNS_IP=$(dig +short "${STAGING_API_HOST}" A | head -n1 || true)

          if [ -z "${STAGING_DNS_IP}" ]; then
            MISSING_INFRA+=("DNS A record for ${STAGING_API_HOST} (currently NXDOMAIN)")
            echo "MISSING infra: DNS A record for ${STAGING_API_HOST} (NXDOMAIN)"
          else
            echo "PRESENT infra: ${STAGING_API_HOST} -> ${STAGING_DNS_IP}"
            if [ -n "${PROD_API_IP}" ] && [ "${STAGING_DNS_IP}" = "${PROD_API_IP}" ]; then
              MISSING_INFRA+=("${STAGING_API_HOST} resolves to production IP ${PROD_API_IP}; expected separate staging host")
            fi
          fi

          if [ -n "${STAGING_EC2_HOST}" ]; then
            if [ "${STAGING_EC2_HOST}" = "api.tiffzy.com" ] || [ "${STAGING_EC2_HOST}" = "tiffzy.com" ] || [ "${STAGING_EC2_HOST}" = "www.tiffzy.com" ] || { [ -n "${PROD_API_IP}" ] && [ "${STAGING_EC2_HOST}" = "${PROD_API_IP}" ]; }; then
              MISSING_INFRA+=("STAGING_EC2_HOST points to production host (${STAGING_EC2_HOST}); refusing production fallback")
            fi
          fi

          {
            echo "## AWS Staging Deployment Preflight"
            echo ""
            echo "- **Target Branch**: \`${GITHUB_REF_NAME}\`"
            echo "- **Target Commit**: \`${GITHUB_SHA}\`"
            echo "- **Expected Service**: \`tiffzy-staging\` in \`/home/ubuntu/cafe-system-staging\`"
            echo "- **Expected Staging API**: \`https://${STAGING_API_HOST}\`"
            echo ""
            if [ "${#MISSING_SECRETS[@]}" -gt 0 ]; then
              echo "### Missing Staging Secrets"
              for s in "${MISSING_SECRETS[@]}"; do
                echo "- \`${s}\`"
              done
              echo ""
            fi
            if [ "${#MISSING_INFRA[@]}" -gt 0 ]; then
              echo "### Missing or Unsafe Staging Infrastructure"
              for inf in "${MISSING_INFRA[@]}"; do
                echo "- ${inf}"
              done
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#MISSING_SECRETS[@]}" -gt 0 ] || [ "${#MISSING_INFRA[@]}" -gt 0 ]; then
            echo "::error::Isolated AWS staging deployment aborted safely. Missing secrets: ${MISSING_SECRETS[*]:-none}. Missing/unsafe infrastructure: ${MISSING_INFRA[*]:-none}."
            exit 1
          fi

      - name: Deploy target commit to isolated AWS staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL || 'https://staging-preview.tiffzy.com' }}
          STAGING_CORS_ORIGINS: ${{ vars.STAGING_CORS_ORIGINS || 'https://staging-preview.tiffzy.com,http://localhost:5173' }}
          STAGING_CORS_ORIGIN_PATTERNS: ${{ vars.STAGING_CORS_ORIGIN_PATTERNS || 'https://cafe-system-*.vercel.app' }}
          STAGING_BACKEND_URL: "https://staging-api.tiffzy.com"
          STAGING_CASHFREE_CLIENT_ID: ${{ secrets.STAGING_CASHFREE_CLIENT_ID || '' }}
          STAGING_CASHFREE_CLIENT_SECRET: ${{ secrets.STAGING_CASHFREE_CLIENT_SECRET || '' }}
          TWM_ENABLED: ${{ vars.STAGING_TWM_ENABLED || 'true' }}
          TWM_MERCHANT_ID: ${{ secrets.STAGING_TWM_MERCHANT_ID }}
          TWM_API_SECRET: ${{ secrets.STAGING_TWM_API_SECRET }}
          TWM_SIGNING_KEY: ${{ secrets.STAGING_TWM_SIGNING_KEY }}
          TWM_URL: ${{ vars.STAGING_TWM_URL || 'https://pay.thewebsitemakers.in' }}
          TWM_NOTIFY_URL: ${{ vars.STAGING_TWM_NOTIFY_URL || 'https://staging-api.tiffzy.com/api/payments/twm/notify' }}
          TWM_RETURN_URL: ${{ vars.STAGING_TWM_RETURN_URL || '' }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.STAGING_EC2_USER }}
          key: ${{ secrets.STAGING_EC2_SSH_KEY }}
          envs: TARGET_SHA,TARGET_BRANCH,STAGING_DATABASE_URL,STAGING_JWT_SECRET,STAGING_FRONTEND_URL,STAGING_CORS_ORIGINS,STAGING_CORS_ORIGIN_PATTERNS,STAGING_BACKEND_URL,STAGING_CASHFREE_CLIENT_ID,STAGING_CASHFREE_CLIENT_SECRET,TWM_ENABLED,TWM_MERCHANT_ID,TWM_API_SECRET,TWM_SIGNING_KEY,TWM_URL,TWM_NOTIFY_URL,TWM_RETURN_URL
          script: |
            set -euo pipefail

            STAGING_DIR="/home/ubuntu/cafe-system-staging"
            STAGING_SERVICE="tiffzy-staging"
            STAGING_PORT="3100"
            REPO_URL="https://github.com/anilchowdary4531/cafe-system.git"

            if [ "$STAGING_DIR" = "/home/ubuntu/cafe-system" ] || [ "$STAGING_SERVICE" = "tiffzy" ]; then
              echo "ERROR: Refusing to touch production directory or production systemd unit."
              exit 1
            fi

            if [ ! -f "/etc/systemd/system/${STAGING_SERVICE}.service" ]; then
              echo "ERROR: Missing systemd unit /etc/systemd/system/${STAGING_SERVICE}.service on staging host."
              exit 1
            fi

            if [ ! -f "/etc/nginx/sites-enabled/staging-api.tiffzy.com" ] && [ ! -f "/etc/nginx/sites-available/staging-api.tiffzy.com" ]; then
              echo "ERROR: Missing Nginx vhost configuration for staging-api.tiffzy.com on staging host."
              exit 1
            fi

            if [ ! -d "$STAGING_DIR/.git" ]; then
              git clone --branch "$TARGET_BRANCH" "$REPO_URL" "$STAGING_DIR"
            fi

            cd "$STAGING_DIR"
            git fetch origin "$TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git checkout --detach "$TARGET_SHA"

            DEPLOYED_HEAD=$(git rev-parse HEAD)
            if [ "$DEPLOYED_HEAD" != "$TARGET_SHA" ]; then
              echo "ERROR: Deployed HEAD ($DEPLOYED_HEAD) does not match target SHA ($TARGET_SHA)."
              exit 1
            fi
            echo "Verified staging checkout SHA: $DEPLOYED_HEAD"

            cd "$STAGING_DIR/backend"
            umask 077
            cat > .env.staging.tmp <<EOF
            NODE_ENV=production
            APP_ENV=staging
            HOST=127.0.0.1
            PORT=${STAGING_PORT}
            DATABASE_URL=${STAGING_DATABASE_URL}
            JWT_SECRET=${STAGING_JWT_SECRET}
            FRONTEND_URL=${STAGING_FRONTEND_URL}
            CORS_ORIGINS=${STAGING_CORS_ORIGINS}
            CORS_ORIGIN_PATTERNS=${STAGING_CORS_ORIGIN_PATTERNS}
            BACKEND_URL=${STAGING_BACKEND_URL}
            CASHFREE_ENVIRONMENT=SANDBOX
            CASHFREE_ENV=SANDBOX
            CASHFREE_CLIENT_ID=${STAGING_CASHFREE_CLIENT_ID}
            CASHFREE_CLIENT_SECRET=${STAGING_CASHFREE_CLIENT_SECRET}
            TWM_ENABLED=${TWM_ENABLED}
            TWM_MERCHANT_ID=${TWM_MERCHANT_ID}
            TWM_API_SECRET=${TWM_API_SECRET}
            TWM_SIGNING_KEY=${TWM_SIGNING_KEY}
            TWM_URL=${TWM_URL}
            TWM_TIMEOUT_MS=15000
            TWM_NOTIFY_URL=${TWM_NOTIFY_URL}
            TWM_RETURN_URL=${TWM_RETURN_URL}
            EOF
            mv .env.staging.tmp .env
            chmod 600 .env

            npm ci --omit=dev
            npx prisma generate

            HAS_MIGRATIONS_TABLE=$(node -e '
              import("./src/prisma.js").then(async ({ default: prisma }) => {
                const rows = await prisma.$queryRaw`SELECT to_regclass('\''public._prisma_migrations'\'')::text AS tbl`;
                const hasRestaurants = await prisma.$queryRaw`SELECT to_regclass('\''public.restaurants'\'')::text AS tbl`;
                console.log(rows[0]?.tbl && hasRestaurants[0]?.tbl ? "migrate" : "push");
                await prisma.$disconnect();
              });
            ')

            if [ "$HAS_MIGRATIONS_TABLE" = "migrate" ]; then
              npx prisma migrate deploy
            else
              npx prisma db push --skip-generate
            fi

            sudo systemctl daemon-reload
            sudo systemctl restart "$STAGING_SERVICE"
            sleep 3

            if ! sudo systemctl is-active --quiet "$STAGING_SERVICE"; then
              echo "ERROR: ${STAGING_SERVICE} failed to start."
              sudo journalctl -u "$STAGING_SERVICE" -n 50 --no-pager
              exit 1
            fi

            for i in $(seq 1 15); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${STAGING_PORT}/health" || true)
              if [ "$CODE" = "200" ]; then
                echo "Staging backend healthy at http://127.0.0.1:${STAGING_PORT}/health"
                curl -s "http://127.0.0.1:${STAGING_PORT}/health"
                echo ""
                exit 0
              fi
              sleep 2
            done

            echo "ERROR: Staging backend health check failed."
            sudo journalctl -u "$STAGING_SERVICE" -n 50 --no-pager
            exit 1

      - name: Verify public staging API and TWM Pay readiness
        run: |
          set -euo pipefail
          HEALTH_JSON=$(curl -fsS https://staging-api.tiffzy.com/health)
          echo "Staging /health: ${HEALTH_JSON}"
          PROVIDERS_JSON=$(curl -fsS https://staging-api.tiffzy.com/api/payments/providers)
          echo "Staging /api/payments/providers: ${PROVIDERS_JSON}"
          node -e '
            const health = JSON.parse(process.argv[1]);
            const providers = JSON.parse(process.argv[2]);
            if (health.status !== "ok") {
              throw new Error(`Expected health.status=ok, got ${health.status}`);
            }
            if (!providers?.twmPay?.configured) {
              throw new Error("Expected TWM Pay to report configured=true on staging");
            }
          ' "${HEALTH_JSON}" "${PROVIDERS_JSON}"
