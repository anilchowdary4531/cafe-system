name: Build and Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGISTRY_URL || 'gcr.io' }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.GCP_REGISTRY_URL || 'gcr.io' }}/${{ secrets.GCP_PROJECT_ID }}/backend ./backend

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.GCP_REGISTRY_URL || 'gcr.io' }}/${{ secrets.GCP_PROJECT_ID }}/backend

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.GCP_VM_USER || secrets.EC2_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cafe-system
            git pull origin main

            cd backend
            npm install

            npx prisma generate

            pm2 restart cafe-backend

