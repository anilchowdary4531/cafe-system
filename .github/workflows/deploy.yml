name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/cafe-system
            git fetch origin main
            git reset --hard origin/main
            cd backend
            if [ -f .env ]; then
              if grep -q "^NODE_ENV=" .env; then
                sed -i 's/^NODE_ENV=.*/NODE_ENV=production/' .env
              else
                echo "NODE_ENV=production" >> .env
              fi
            else
              echo "NODE_ENV=production" >> .env
            fi
            sudo sed -i 's/NODE_ENV=development/NODE_ENV=production/g' /etc/systemd/system/tiffzy.service 2>/dev/null || true
            sudo systemctl daemon-reload 2>/dev/null || true
            npm install
            npx prisma generate
            npx prisma migrate deploy || true
            npx prisma db push --accept-data-loss=false || true
            sudo systemctl restart tiffzy
            sudo systemctl is-active --quiet tiffzy
            echo "Tiffzy backend restarted successfully"

